<!DOCTYPE html>
    <html lang="en">
    <head>
        <link rel="stylesheet" href="styles.css">
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cooking Recipes For Disaster</title>
    </head>

    <body>
        <div class="aura-bg">
            <div class="aura-layer-1" aria-hidden="true"></div>
            <div class="aura-layer-2" aria-hidden="true"></div>
            <div class="aura-content">
                <header class="header">
                    <div class="header-bg">
                        <img src="images/header-img.jpg" alt="Recipe header background" class="header-image">
                        <div class="header-overlay"></div>
                    </div>
                    <div class="header-content">
                        <h1 id="header-tagline">Got a Recipe You Want to Share?</h1>
                        <h3 id="header-subtagline">And Maybe Help Others Destroy Their Kitchens Too?</h3>
                        <p id="header-description">Share your favorite recipe below!</p>
                    </div>
                </header>
                <main>
                    <form id="recipe-form" class="recipe-form">
                        <section class="form-section"> 

                            <h3>Submission Type</h3>
                            <div class="form-group">
                                <label for="submission-type">What are you submitting? <span class="required-asterisk">*</span></label>
                                <select id="submission-type" name="submission-type" required>
                                    <option value="">Select submission type</option>
                                    <option value="new">New Recipe</option>
                                    <option value="variation">Variation of Existing Recipe</option>
                                </select>
                                <span class="error-message" id="submission-type-error" aria-live="polite"></span>
                            </div>

                            <div id="variation-recipe-select" class="form-group" style="display: none;">
                                <label for="parent-recipe">Select Existing Recipe <span class="required-asterisk">*</span></label>
                                <select id="parent-recipe" name="parent-recipe">
                                    <option value="">Select a recipe...</option>
                                </select>
                                <span class="error-message" id="parent-recipe-error" aria-live="polite"></span>
                            </div>

                            <div class="form-group">
                                <label for="variation-label">Variation Name <span class="required-asterisk">*</span></label>
                                <input type="text" id="variation-label" name="variation-label" placeholder="e.g., Spicy Chicken Adobo">
                                <span class="error-message" id="variation-label-error" aria-live="polite"></span>
                            </div>

                            <h3>Basic Info</h3>
                            <div class="form-group">
                                <label for="author-name">Your Name</label>
                                <input type="text" id="author-name" name="author-name" placeholder="Optional, it's up to you!">
                                <span class="error-message" id="author-name-error" aria-live="polite"></span>
                            </div>

                            <div class="form-group">
                                <label for="title">Title <span class="required-asterisk">*</span></label>
                                <input type="text" id="title" name="title" required placeholder="e.g., Chicken Adobo">
                                <span class="error-message" id="title-error" aria-live="polite"></span>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="category">Category <span class="required-asterisk">*</span></label>
                                    <select id="category" name="category" required>
                                        <option value="">Select category</option>
                                        <option value="Breakfast">Breakfast</option>
                                        <option value="Lunch">Lunch</option>
                                        <option value="Dinner">Dinner</option>
                                        <option value="Dessert">Dessert</option>
                                    </select>
                                    <span class="error-message" id="category-error" aria-live="polite"></span>
                                </div>
                                
                                <div class="form-group">
                                    <label for="protein">Protein <span class="required-asterisk">*</span></label>
                                    <select id="protein" name="protein" required>
                                        <option value="">Select protein</option>
                                        <option value="Chicken">Chicken</option>
                                        <option value="Pork">Pork</option>
                                        <option value="Fish">Fish</option>
                                        <option value="Beef">Beef</option>
                                        <option value="Other">Other</option>
                                    </select>
                                    <span class="error-message" id="protein-error" aria-live="polite"></span>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="description">Description <span class="required-asterisk">*</span></label>
                                <textarea id="description" name="description" required rows="3" placeholder="Describe your recipe..."></textarea>
                                <span class="error-message" id="description-error" aria-live="polite"></span>
                            </div>

                            <div class="form-group">
                                <label for="youtube-url">YouTube Video URL (Optional)</label>
                                <input type="url" id="youtube-url" name="youtube-url" placeholder="https://www.youtube.com/watch?v=...">
                                <span class="error-message" id="youtube-url-error" aria-live="polite"></span>
                                <small class="form-hint">Paste a YouTube link (e.g., youtube.com/watch?v=XtFu4wUN2Ok or youtu.be/XtFu4wUN2Ok)</small>
                            </div>
                        </section>

                        <section class="form-section">
                            <h3>Meta Fields</h3>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="servings">Servings <span class="required-asterisk">*</span></label>
                                    <input type="number" id="servings" name="servings" required min="1" value="4">
                                    <span class="error-message" id="servings-error" aria-live="polite"></span>
                                </div>

                                <div class="form-group">
                                    <label for="prepDuration">Prep Duration <span class="required-asterisk">*</span></label>
                                    <input type="text" id="prepDuration" name="prepDuration" required placeholder="e.g., 15 minutes">
                                    <span class="error-message" id="prepDuration-error" aria-live="polite"></span>
                                </div>

                                <div class="form-group">
                                    <label for="cookDuration">Cook Duration <span class="required-asterisk">*</span></label>
                                    <input type="text" id="cookDuration" name="cookDuration" required placeholder="e.g., 45 minutes">
                                    <span class="error-message" id="cookDuration-error" aria-live="polite"></span>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="difficulty">Difficulty <span class="required-asterisk">*</span></label>
                                <select id="difficulty" name="difficulty" required>
                                    <option value="">Select difficulty</option>
                                    <option value="Easy">Easy</option>
                                    <option value="Medium">Medium</option>
                                    <option value="Hard">Hard</option>
                                </select>
                                <span class="error-message" id="difficulty-error" aria-live="polite"></span>
                            </div>
                        </section>

                        <section class="form-section">
                            <h3>Ingredients</h3>
                            <div id="ingredients-list" class="dynamic-list"></div>
                            <button type="button" id="add-ingredient" class="btn btn-secondary"> <img src="logos/add.png" alt="Add"></button>
                        </section>

                        <section class="form-section">
                            <h3>Steps</h3>
                            <div id="steps-list" class="dynamic-list"></div>
                            <button type="button" id="add-step" class="btn btn-secondary"> <img src="logos/add.png" alt="Add"></button>
                        </section>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary"> Submit Recipe </button>
                        </div>
                    </form>

                    <div id="form-message" class="form-message" aria-live="polite"></div>
                </main>

                <nav class="nav">
                    <a href="homepage.html" class="nav-logo"> <img src="logos/CRFDLogo.png" alt="Logo"> </a>
                    <ul>
                        <li id="about"><a href="about.html">About</a></li>
                        <li id="submit"><a href="submission.html">Submit A Recipe</a></li>
                        <li id="search"><a href="homepage.html#search"> <img src="logos/search.png" alt="Search"> </a></li>
                    </ul>
                </nav>
            </div>
        </div>

        <script src="submission.js"></script>
    </body>
</html>
